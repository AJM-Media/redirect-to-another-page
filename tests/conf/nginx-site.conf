server {
	listen 80;
	server_name site.test;
	root /var/www/html;
	index index.php;


	#MULTISITE

	location __BASE__/ {
		try_files $uri $uri/ __BASE__/index.php?$args;
	}

	location ~ \.php$ {
		try_files $uri =404;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_pass php:9000;
	}

}
